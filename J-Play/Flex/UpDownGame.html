<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>업다운 게임</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 30px; background-color: #f9f9f9; }
.container {
    background: #fff;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    display: inline-block;
    min-width: 550px; /* 기존보다 50~100px 정도만 더 키움 */
}
    input, button { padding: 10px; font-size: 16px; margin: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button { background-color: #007bff; color: white; cursor: pointer; border: none; }
    button:hover { background-color: #0056b3; }
    #resetBtn { background-color: #6c757d; }
    #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #333; }
    #chance { margin-top: 10px; font-size: 18px; color: #e74c3c; }
#number-buttons {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px; /* 버튼 사이 간격을 살짝만 더 띄움 */
    max-width: 500px; /* 버튼들이 놓일 전체 너비를 살짝 키움 */
    margin-left: auto;
    margin-right: auto;
}
    .num-btn { padding: 8px; font-size: 14px; cursor: pointer; background-color: #eee; color: #333; }
    .num-btn:disabled { background-color: #ddd; color: #aaa; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="container">
    <h1>업다운 게임 🎯</h1>
    <p>1부터 100 사이의 숫자를 맞춰보세요! (총 5번 기회)</p>

    <input type="number" id="userInput" min="1" max="100" placeholder="숫자 입력" />
    <button id="submitBtn">제출</button>
    <button id="resetBtn">리셋</button>

    <div id="result"></div>
    <div id="chance">남은 기회: 5</div>

    <div id="number-buttons"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let answer = Math.floor(Math.random() * 100) + 1;
      let tries = 5;
      let gameOver = false;
      let minLimit = 1;
      let maxLimit = 100;

      // 제작자님이 주신 음원 딱 두 개만 사용
      const successSound = new Audio('success.mp3');
      const failSound = new Audio('Fail.mp3');

      const userInput = document.getElementById('userInput');
      const result = document.getElementById('result');
      const chance = document.getElementById('chance');
      const numberButtons = document.getElementById('number-buttons');
      const submitBtn = document.getElementById('submitBtn');
      const resetBtn = document.getElementById('resetBtn');

      function createNumberButtons() {
        numberButtons.innerHTML = "";
        for (let i = 1; i <= 100; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.classList.add("num-btn");
          btn.id = `btn-${i}`;
          btn.onclick = () => {
            if (!gameOver) {
              userInput.value = i;
              checkNumber();
            }
          };
          numberButtons.appendChild(btn);
        }
      }

      function updateDisabledButtons() {
        for (let i = 1; i <= 100; i++) {
          const btn = document.getElementById(`btn-${i}`);
          if (btn) {
            btn.disabled = i < minLimit || i > maxLimit || gameOver;
          }
        }
      }

      function checkNumber() {
        if (gameOver) return;

        const input = Number(userInput.value);
        if (input < 1 || input > 100 || isNaN(input)) return;

        tries--;

        if (input < answer) {
          // 정답 아니니까 바로 실패 사운드
          failSound.currentTime = 0; 
          failSound.play();
          result.textContent = "업! 🔼";
          minLimit = Math.max(minLimit, input + 1);
        } else if (input > answer) {
          // 정답 아니니까 바로 실패 사운드
          failSound.currentTime = 0;
          failSound.play();
          result.textContent = "다운! 🔽";
          maxLimit = Math.min(maxLimit, input - 1);
        } else {
          // 정답일 때만 성공 사운드
          result.textContent = `🎉 정답입니다! (${answer})`;
          successSound.play();
          gameOver = true;
        }

        if (tries === 0 && input !== answer) {
          result.textContent = `❌ 틀렸습니다. 정답은 ${answer}입니다.`;
          gameOver = true;
        }

        chance.textContent = `남은 기회: ${tries}`;
        updateDisabledButtons();
      }

      function resetGame() {
        answer = Math.floor(Math.random() * 100) + 1;
        tries = 5;
        gameOver = false;
        minLimit = 1;
        maxLimit = 100;
        userInput.value = "";
        result.textContent = "";
        chance.textContent = "남은 기회: 5";
        createNumberButtons();
        updateDisabledButtons();
      }

      submitBtn.addEventListener('click', checkNumber);
      resetBtn.addEventListener('click', resetGame);
      userInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkNumber(); });

      createNumberButtons();
      updateDisabledButtons();
    });
  </script>

</body>
</html>
